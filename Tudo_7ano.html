sou a controlar mais a colônia.\"], \"terms\": [[\"Tordesilhas\", \"Tratado de 1494 entre Portugal e Espanha.\"], [\"Capitanias hereditárias\", \"Faixas do litoral entregues a donatários, a partir de 1534.\"], [\"Donatário\", \"Responsável por uma capitania.\"], [\"Governo-Geral\", \"Administração central da colônia, criada em 1549.\"]], \"q\": {\"q\": \"Quem foi o primeiro governador-geral do Brasil?\", \"o\": [\"Tomé de Sousa\", \"Pedro Álvares Cabral\", \"Dom João VI\"], \"c\": 0, \"e\": \"Ele chegou em 1549 e fundou Salvador.\"}, \"fun\": \"Salvador foi a primeira capital da colônia.\"}, {\"t\": \"topic\", \"ico\": \"🍬\", \"h\": \"Açúcar e engenho\", \"sub\": \"A economia do litoral\", \"pts\": [\"O <b>açúcar<\/b> foi o grande produto da colônia, sobretudo no Nordeste.\", \"Era produzido nos <b>engenhos<\/b>, grandes propriedades com plantação de cana e fábrica.\", \"O sistema era de <b>monocultura<\/b> em grandes terras (latifúndio) e com <b>mão de obra escravizada<\/b>.\", \"Trabalhavam pessoas escravizadas, africanas e também indígenas.\"], \"terms\": [[\"Engenho\", \"Propriedade que produzia açúcar.\"], [\"Monocultura\", \"Plantação de um único produto em grande escala.\"], [\"Latifúndio\", \"Grande propriedade de terra.\"], [\"Escravização\", \"Trabalho forçado, sem liberdade nem salário.\"]], \"q\": {\"q\": \"Como se chamava a propriedade rural que produzia açúcar?\", \"o\": [\"Quilombo\", \"Engenho\", \"Aldeamento\"], \"c\": 1, \"e\": \"O engenho usava trabalho escravizado.\"}, \"fun\": \"Os engenhos ficavam sobretudo no litoral do Nordeste.\"}, {\"t\": \"topic\", \"ico\": \"🐂\", \"h\": \"Pecuária, bandeiras e interior\", \"sub\": \"A ocupação do sertão\", \"pts\": [\"A <b>pecuária<\/b> levou a ocupação para o <b>sertão<\/b> do Nordeste. O gado se espalhou pelo interior.\", \"As <b>bandeiras<\/b> eram expedições paulistas em busca de indígenas e riquezas minerais. Os bandeirantes ampliaram o território português.\", \"Os <b>tropeiros<\/b> transportavam mercadorias no lombo de mulas.\", \"Os <b>aldeamentos<\/b> eram povoados indígenas organizados por missionários.\"], \"terms\": [[\"Sertão\", \"Região do interior, longe do litoral.\"], [\"Bandeiras\", \"Expedições paulistas ao interior.\"], [\"Tropeiros\", \"Transportavam mercadorias em mulas.\"], [\"Aldeamento\", \"Povoado indígena organizado por missionários.\"]], \"q\": {\"q\": \"Qual atividade levou a ocupação para o sertão do Nordeste?\", \"o\": [\"Pecuária\", \"Mineração\", \"Navegação\"], \"c\": 0, \"e\": \"O gado se espalhou pelo interior.\"}, \"fun\": \"Ao avançar para o interior, os bandeirantes ultrapassaram a linha de Tordesilhas.\"}, {\"t\": \"topic\", \"ico\": \"⛏️\", \"h\": \"Ouro e Minas Gerais\", \"sub\": \"Mineração e limites do Brasil\", \"pts\": [\"O <b>ouro<\/b> foi encontrado em Minas Gerais no fim do século XVII. <b>Vila Rica<\/b> foi um centro da mineração.\", \"A Coroa cobrava o <b>quinto<\/b>: 20% do ouro. O metal era fundido e taxado nas <b>casas de fundição<\/b>.\", \"A população se concentrou nas regiões de mineração e cresceu o comércio de mulas e mercadorias.\", \"O <b>Tratado de Madri<\/b> (1750) ajustou os limites e reconheceu o avanço português para o interior.\"], \"terms\": [[\"Quinto\", \"Imposto de 20% sobre o ouro.\"], [\"Casa de fundição\", \"Local onde o ouro era fundido e taxado.\"], [\"Vila Rica\", \"Centro da mineração em Minas Gerais.\"], [\"Tratado de Madri\", \"Acordo de 1750 sobre os limites do Brasil.\"]], \"q\": {\"q\": \"Qual era o imposto de 20% sobre o ouro?\", \"o\": [\"Dízimo\", \"Quinto\", \"Pedágio\"], \"c\": 1, \"e\": \"Era a quinta parte para a Coroa.\"}, \"fun\": \"Vila Rica é hoje a cidade de Ouro Preto.\"}, {\"t\": \"topic\", \"ico\": \"⛵\", \"h\": \"África e o tráfico atlântico\", \"sub\": \"De onde vieram os africanos\", \"pts\": [\"A África tinha reinos e culturas diversas. O <b>Reino do Congo<\/b> teve contato com Portugal desde o fim do século XV.\", \"O <b>tráfico atlântico<\/b> levou milhões de africanos à força para a América. Os navios eram os <b>tumbeiros<\/b>, com condições terríveis.\", \"Os africanos trouxeram saberes de <b>agricultura, metalurgia e culinária<\/b>.\", \"A cultura africana está na <b>capoeira<\/b> (luta e dança) e no <b>candomblé<\/b> (religião de matriz africana).\"], \"terms\": [[\"Reino do Congo\", \"Reino da África Central em contato com Portugal.\"], [\"Tumbeiros\", \"Navios do tráfico atlântico.\"], [\"Capoeira\", \"Luta e dança afro-brasileira.\"], [\"Candomblé\", \"Religião de matriz africana.\"]], \"q\": {\"q\": \"Como eram chamados os navios que levavam africanos escravizados?\", \"o\": [\"Caravelas\", \"Tumbeiros\", \"Galeões reais\"], \"c\": 1, \"e\": \"Muitos morriam na travessia.\"}, \"fun\": \"Os africanos escravizados pertenciam a povos e reinos diferentes, com línguas e culturas próprias.\"}, {\"t\": \"topic\", \"ico\": \"✊🏾\", \"h\": \"Resistência e protagonismo\", \"sub\": \"Palmares, Zumbi e outras histórias\", \"pts\": [\"<b>Palmares<\/b> foi o maior quilombo do período colonial. Ficava na <b>Serra da Barriga<\/b>, hoje em Alagoas.\", \"<b>Zumbi<\/b> foi um grande líder de Palmares, morto em <b>1695<\/b>. Em <b>20 de novembro<\/b> lembramos o Dia da Consciência Negra.\", \"<b>Nzinga Mbandi<\/b>, rainha do Ndongo e do Matamba, resistiu à dominação portuguesa.\", \"<b>Esperança Garcia<\/b> escreveu uma carta ao governador do Piauí em <b>1770<\/b>, denunciando maus-tratos. <b>Chica da Silva<\/b> nasceu escravizada, conquistou a liberdade e teve destaque no Tejuco.\"], \"terms\": [[\"Quilombo\", \"Comunidade de pessoas que fugiram da escravização.\"], [\"Palmares\", \"Maior quilombo do período colonial.\"], [\"Zumbi\", \"Líder de Palmares, morto em 1695.\"], [\"Esperança Garcia\", \"Escreveu ao governador do Piauí em 1770.\"]], \"q\": {\"q\": \"Quem foi o grande líder de Palmares morto em 1695?\", \"o\": [\"Zumbi\", \"Tomé de Sousa\", \"Dom Pedro\"], \"c\": 0, \"e\": \"Palmares resistiu por quase um século.\"}, \"fun\": \
